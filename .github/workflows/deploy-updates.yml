name: Deploy public PitSystem updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify large packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/public_update_store.py hydrate --checkout .
      - name: Assemble only public update content
        run: |
          mkdir site
          test -d tuf && cp -R tuf site/
          if test -d production; then cp -R production site/; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
